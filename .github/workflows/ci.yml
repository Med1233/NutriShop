name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  POSTGRES_USER: admin
  POSTGRES_PASSWORD: password
  POSTGRES_DB: appdb
  DATABASE_URL: postgresql://admin:password@localhost:5432/appdb
  JWT_SECRET: ci-jwt-secret
  JWT_REFRESH_SECRET: ci-refresh-secret
  FRONTEND_URL: http://localhost:3000

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  test-ui:
    name: UI Component Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nutrishop/ui test

  deploy-storybook:
    name: Deploy Storybook to GitHub Pages
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nutrishop/ui build-storybook

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/ui/storybook-static/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter frontend test

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
          POSTGRES_DB: appdb_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U admin -d appdb_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter backend test
        env:
          DATABASE_URL: postgresql://admin:password@localhost:5433/appdb_test
          JWT_SECRET: test-jwt-secret
          JWT_REFRESH_SECRET: test-refresh-secret

  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter frontend build
        env:
          NEXT_PUBLIC_BACKEND_URL: http://localhost:4000

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test-ui, test-frontend, test-backend, build-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t nutrishop-backend ./backend

      - name: Build frontend image
        run: >
          docker build
          -f frontend/Dockerfile
          --build-arg NEXT_PUBLIC_BACKEND_URL=http://localhost:4000
          -t nutrishop-frontend .

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [lint, test-ui, test-frontend, test-backend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d appdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Cypress binary
        run: pnpm --filter e2e exec cypress install

      - name: Start backend
        run: node backend/src/index.js &
        env:
          DATABASE_URL: postgresql://admin:password@localhost:5432/appdb
          JWT_SECRET: ci-jwt-secret
          JWT_REFRESH_SECRET: ci-refresh-secret
          FRONTEND_URL: http://localhost:3000

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            curl -s http://localhost:4000/api/products && break
            sleep 1
          done

      - name: Build and start frontend
        run: |
          pnpm --filter frontend build
          pnpm --filter frontend start &
        env:
          BACKEND_URL: http://localhost:4000
          NEXT_PUBLIC_BACKEND_URL: http://localhost:4000

      - name: Wait for frontend
        run: |
          for i in $(seq 1 30); do
            curl -s http://localhost:3000 && break
            sleep 1
          done

      - name: Run Cypress E2E tests
        run: pnpm --filter e2e test
        env:
          CYPRESS_BASE_URL: http://localhost:3000

      - name: Upload Cypress screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: e2e/cypress/screenshots/

      - name: Upload Cypress videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: e2e/cypress/videos/
          if-no-files-found: ignore
